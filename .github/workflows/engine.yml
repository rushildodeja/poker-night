name: Poker Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install engine dependencies
        working-directory: packages/poker-engine
        run: npm install
      - name: Typecheck engine
        working-directory: packages/poker-engine
        run: npm run typecheck
      - name: Test engine
        working-directory: packages/poker-engine
        run: npm test
